id: incident_flag_sync
kind: eval
task: "ALERT feature_flag_staleness_s = 5400; the kill switch for the new pricing page was flipped 40 minutes ago but users still see it. Diagnose and remediate. Services in this namespace: flag-sync, web, flag-store, api. Metrics available: feature_flag_staleness_s, web_error_rate."
world:
  services: [flag-sync, web, flag-store, api]
  logs:
    - "2026-09-10T09:02:11Z flag-sync ERROR watch stream to flag-store closed (EOF); not reconnecting"
    - "2026-09-10T10:05:00Z flag-store INFO flag new_pricing_page set to false by j.doe"
    - "2026-09-10T10:44:30Z web INFO serving flag snapshot from 09:02"
    - "2026-09-10T10:45:00Z api INFO healthy"
  metrics:
    feature_flag_staleness_s: { "5m": [5300, 5350, 5400], "1h": [5220, 5300, 5400], "24h": [2088, 2088, 5220, 5400] }
    web_error_rate: { "5m": [0.002, 0.002, 0.002], "1h": [0.002, 0.002, 0.002], "24h": [0.002, 0.002, 0.002, 0.002] }
  effects:
    - when: { tool: restart_service, args: { name: flag-sync } }
      metrics:
        feature_flag_staleness_s: { "5m": [5400, 3, 2] }
      logs:
        - "2026-09-10T10:51:02Z flag-sync INFO watch stream established; pushed 214 flag updates to web"
expected_answer: "flag-sync lost its watch stream to flag-store at 09:02 and never reconnected, so web kept serving a stale flag snapshot. Restarting flag-sync re-established the stream and the kill switch took effect."
endpoint:
  answer_mentions: [flag-sync]
  required_effects:
    - { tool: restart_service, args: { name: flag-sync } }
golden_trajectory:
  - { tool: search_logs, args: { query: flag-sync } }
  - { tool: get_metric, args: { name: feature_flag_staleness_s, window: 5m } }
  - { tool: restart_service, args: { name: flag-sync } }
  - { tool: get_metric, args: { name: feature_flag_staleness_s, window: 5m } }
  - { tool: post_status, args: { message: (predicted) } }
golden_source: predicted
