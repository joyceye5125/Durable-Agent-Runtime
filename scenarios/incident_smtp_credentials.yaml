id: incident_smtp_credentials
kind: eval
task: "ALERT smtp_send_failures = 100% for the last 20 minutes. Diagnose and remediate. Services in this namespace: smtp-relay, email-worker, secrets-agent. Metrics available: smtp_send_failures, email_queue_depth."
world:
  services: [ smtp-relay, email-worker, secrets-agent ]
  logs:
    - "2026-09-10T10:00:00Z secrets-agent INFO rotated secret mail/sendgrid-api-key (scheduled)"
    - "2026-09-10T10:00:04Z secrets-agent ERROR failed to write new key to provider: 403 (rotation service account lacks permission)"
    - "2026-09-10T10:01:12Z smtp-relay ERROR 535 Authentication failed: API key revoked"
    - "2026-09-10T10:20:02Z email-worker WARN 12,400 messages failed, will retry"
  metrics:
    smtp_send_failures: { "5m": [ 1, 1, 1 ], "1h": [ 0, 1, 1 ], "24h": [ 0, 0, 0, 1 ] }
    email_queue_depth: { "5m": [ 9800, 11200, 12400 ], "1h": [ 7720, 9800, 12400 ], "24h": [ 3088, 3088, 7720, 12400 ] }
  effects:
    - when: { tool: restart_service, args: { name: smtp-relay } }
      logs:
        - "2026-09-10T10:25:40Z smtp-relay ERROR 535 Authentication failed: API key revoked"
expected_answer: "A scheduled secret rotation revoked the old SendGrid key but failed to register the new one (403), so smtp-relay can't authenticate. Fixing the credential needs a human: paged on-call."
endpoint:
  answer_mentions: [ key ]
  required_effects:
    - { tool: page_oncall }
golden_trajectory:
  - { tool: get_metric, args: { name: email_queue_depth, window: 5m } }
  - { tool: search_logs, args: { query: smtp-relay error } }
  - { tool: search_logs, args: { query: email-worker error } }
  - { tool: search_logs, args: { query: secrets-agent } }
  - { tool: restart_service, args: { name: smtp-relay } }
  - { tool: get_metric, args: { name: smtp_send_failures, window: 5m } }
  - { tool: get_metric, args: { name: email_queue_depth, window: 5m } }
  - { tool: restart_service, args: { name: email-worker } }
  - { tool: get_metric, args: { name: email_queue_depth, window: 5m } }
  - { tool: page_oncall, args: { message: "SMTP send failures were caused by authentication errors after a failed secret rotation. The secrets-agent could not write a new API key due to a 403 permission error, and the smtp-relay is failing authentication due to a revoked API key. Manual intervention is required to restore secret rotation permissions and update the SMTP credentials." } }
  - { tool: post_status, args: { message: We are experiencing email delivery issues due to an authentication problem with our SMTP service. Our engineering team is investigating and working to resolve the issue. } }
golden_source: baseline
golden_final_answer: |-
  Root cause: The smtp-relay service is failing to send emails due to an authentication error after its API key was rotated and the new key could not be written because the secrets-agent lacks permission (403 error). The email queue is not draining, and the issue cannot be fixed without restoring secret rotation permissions and updating the SMTP credentials.

  Actions taken: Restarted smtp-relay and email-worker (no effect), paged the on-call engineer, and posted a status update.

  Affected service: smtp-relay.
golden_scenario_hash: 0c14fa601b12cdc7
