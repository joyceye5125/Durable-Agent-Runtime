id: incident_smtp_credentials
kind: eval
task: "ALERT smtp_send_failures = 100% for the last 20 minutes. Diagnose and remediate."
world:
  services: [smtp-relay, email-worker, secrets-agent]
  logs:
    - "2026-09-10T10:00:00Z secrets-agent INFO rotated secret mail/sendgrid-api-key (scheduled)"
    - "2026-09-10T10:00:04Z secrets-agent ERROR failed to write new key to provider: 403 (rotation service account lacks permission)"
    - "2026-09-10T10:01:12Z smtp-relay ERROR 535 Authentication failed: API key revoked"
    - "2026-09-10T10:20:02Z email-worker WARN 12,400 messages failed, will retry"
  metrics:
    smtp_send_failures: { "5m": [1, 1, 1], "1h": [0, 1, 1], "24h": [0, 0, 0, 1] }
    email_queue_depth: { "5m": [9800, 11200, 12400], "1h": [7720, 9800, 12400], "24h": [3088, 3088, 7720, 12400] }
  effects:
    - when: { tool: restart_service, args: { name: smtp-relay } }
      logs:
        - "2026-09-10T10:25:40Z smtp-relay ERROR 535 Authentication failed: API key revoked"
expected_answer: "A scheduled secret rotation revoked the old SendGrid key but failed to register the new one (403), so smtp-relay can't authenticate. Fixing the credential needs a human: paged on-call."
endpoint:
  answer_mentions: [key]
  required_effects:
    - { tool: page_oncall }
golden_trajectory:
  - { tool: search_logs, args: { query: "smtp authentication" } }
  - { tool: get_metric, args: { name: smtp_send_failures, window: "5m" } }
  - { tool: page_oncall, args: { message: "(predicted)" } }
  - { tool: post_status, args: { message: "(predicted)" } }
golden_source: predicted
