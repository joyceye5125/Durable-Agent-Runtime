id: incident_cache_and_capacity
kind: eval
max_steps: 16
task: "ALERT pricing_api_latency_p99_ms = 2600 and pricing_api_cpu = 96%. Diagnose and remediate. Services in this namespace: pricing-api, price-cache, catalog, postgres. Metrics available: pricing_api_latency_p99_ms, pricing_api_cpu, price_cache_hit_ratio, pricing_api_replicas."
world:
  services: [ pricing-api, price-cache, catalog, postgres ]
  logs:
    - "2026-09-10T11:30:02Z price-cache ERROR stuck in loading state after failed snapshot restore; serving no keys"
    - "2026-09-10T11:30:40Z pricing-api WARN cache miss 100%, computing prices from catalog"
    - "2026-09-10T11:31:00Z pricing-api INFO flash sale traffic 2x; runbook: 6 replicas during sales (currently 3)"
    - "2026-09-10T11:31:30Z catalog INFO p99 90ms"
  metrics:
    pricing_api_latency_p99_ms: { "5m": [ 2100, 2500, 2600 ], "1h": [ 1700, 2100, 2600 ], "24h": [ 680, 680, 1700, 2600 ] }
    pricing_api_cpu: { "5m": [ 0.93, 0.95, 0.96 ], "1h": [ 0.906, 0.93, 0.96 ], "24h": [ 0.362, 0.362, 0.906, 0.96 ] }
    price_cache_hit_ratio: { "5m": [ 0, 0, 0 ], "1h": [ 0, 0, 0 ], "24h": [ 0, 0, 0, 0 ] }
    pricing_api_replicas: { "5m": [ 3, 3, 3 ], "1h": [ 3, 3, 3 ], "24h": [ 3, 3, 3, 3 ] }
  effects:
    # Cache back, but 3 replicas are still saturated by flash-sale traffic:
    # latency improves and CPU does not move at all.
    - when: { tool: restart_service, args: { name: price-cache } }
      metrics:
        price_cache_hit_ratio: { "5m": [ 0, 0.71, 0.9 ] }
        pricing_api_latency_p99_ms: { "5m": [ 2600, 1900, 1700 ] }
      logs:
        - "2026-09-10T11:36:10Z price-cache INFO snapshot rebuilt from source; serving keys"
        - "2026-09-10T11:36:40Z pricing-api WARN cpu 96% on 3 replicas; flash-sale traffic 2x (runbook: 6 replicas)"
    # Capacity added while every lookup still misses the cache: CPU eases,
    # latency is unchanged because the work per request has not changed.
    - when: { tool: scale_service, args: { name: pricing-api, replicas: { gte: 4 } } }
      metrics:
        pricing_api_cpu: { "5m": [ 0.96, 0.89, 0.87 ] }
        pricing_api_replicas: { "5m": [ 3, 4, 4 ] }
      logs:
        - "2026-09-10T11:38:02Z pricing-api INFO scaled out; cpu still high for flash-sale traffic (runbook: 6 replicas)"
    - when: { tool: scale_service, args: { name: pricing-api, replicas: { gte: 6 } } }
      metrics:
        pricing_api_cpu: { "5m": [ 0.96, 0.70, 0.62 ] }
        pricing_api_replicas: { "5m": [ 3, 6, 6 ] }
    # Only both together clear the alert.
    - when_all:
        - { tool: restart_service, args: { name: price-cache } }
        - { tool: scale_service, args: { name: pricing-api, replicas: { gte: 6 } } }
      metrics:
        pricing_api_latency_p99_ms: { "5m": [ 1700, 600, 300 ] }
        pricing_api_cpu: { "5m": [ 0.94, 0.55, 0.44 ] }
expected_answer: "Two problems: price-cache was stuck after a failed snapshot restore (0% hits), and flash-sale traffic needs 6 pricing-api replicas, not 3. Restarted price-cache and scaled pricing-api to 6; latency and CPU recovered."
endpoint:
  answer_mentions: [ price-cache, pricing-api ]
  required_effects:
    - { tool: restart_service, args: { name: price-cache } }
    - { tool: scale_service, args: { name: pricing-api, replicas: { gte: 6 } } }
golden_trajectory:
  - { tool: get_metric, args: { name: pricing_api_latency_p99_ms, window: 1h } }
  - { tool: get_metric, args: { name: pricing_api_cpu, window: 1h } }
  - { tool: get_metric, args: { name: pricing_api_replicas, window: 1h } }
  - { tool: get_metric, args: { name: price_cache_hit_ratio, window: 1h } }
  - { tool: search_logs, args: { query: pricing-api error } }
  - { tool: scale_service, args: { name: pricing-api, replicas: 6 } }
  - { tool: get_metric, args: { name: pricing_api_latency_p99_ms, window: 5m } }
  - { tool: get_metric, args: { name: pricing_api_cpu, window: 5m } }
  - { tool: get_metric, args: { name: pricing_api_latency_p99_ms, window: 5m } }
  - { tool: search_logs, args: { query: price-cache } }
  - { tool: restart_service, args: { name: price-cache } }
  - { tool: get_metric, args: { name: price_cache_hit_ratio, window: 5m } }
  - { tool: get_metric, args: { name: pricing_api_latency_p99_ms, window: 5m } }
  - { tool: get_metric, args: { name: pricing_api_cpu, window: 5m } }
  - { tool: post_status, args: { message: "Incident resolved: pricing-api latency and CPU returned to normal after scaling up and restoring price-cache. Root cause: price-cache was stuck and serving no keys, causing 100% cache misses and overload on pricing-api during high traffic." } }
golden_source: baseline
golden_final_answer: |-
  Root cause: The price-cache service was stuck in a loading state after a failed snapshot restore, resulting in 100% cache misses. This forced pricing-api to compute all prices from the catalog under flash sale traffic, overloading its CPU and increasing latency.

  Action taken: Scaled pricing-api to 6 replicas (per runbook for sales) and restarted price-cache, restoring cache hit ratio and normalizing pricing-api latency and CPU.

  Affected service: pricing-api (impacted by price-cache failure).
golden_scenario_hash: 78acc23c5bd60c00
