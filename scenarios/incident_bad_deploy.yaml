id: incident_bad_deploy
kind: eval
task: "ALERT api_error_rate = 18% (SLO 1%) since 14:02 UTC. Diagnose and remediate."
world:
  services: [api, postgres, session-cache, deployer]
  logs:
    - "2026-09-10T13:58:12Z postgres INFO autovacuum finished on table orders"
    - "2026-09-10T14:01:30Z deployer INFO api v2.41.0 rolled out to 100% of instances (previous: v2.40.3)"
    - "2026-09-10T14:02:05Z api ERROR NullPointerException at CheckoutHandler.applyCoupon (api v2.41.0)"
    - "2026-09-10T14:02:07Z api ERROR NullPointerException at CheckoutHandler.applyCoupon (api v2.41.0)"
    - "2026-09-10T14:03:40Z session-cache INFO hit ratio 0.97"
    - "2026-09-10T14:05:02Z api ERROR 500 on POST /checkout (api v2.41.0)"
  metrics:
    api_error_rate: { "5m": [0.004, 0.17, 0.18], "1h": [0.003, 0.004, 0.18] }
    api_latency_p99_ms: { "5m": [210, 230, 225] }
    postgres_cpu: { "5m": [0.31, 0.30, 0.33] }
  effects:
    - when: { tool: restart_service, args: { name: api } }
      logs:
        - "2026-09-10T14:09:13Z api INFO restarted (api v2.41.0)"
        - "2026-09-10T14:09:20Z api ERROR NullPointerException at CheckoutHandler.applyCoupon (api v2.41.0)"
expected_answer: "api v2.41.0, deployed at 14:01, throws a NullPointerException in the coupon path. There is no rollback tool, so the fix is to page on-call to roll back to v2.40.3."
endpoint:
  answer_mentions: [v2.41.0]
  required_effects:
    - { tool: page_oncall }
