id: incident_bad_deploy
kind: eval
task: "ALERT api_error_rate = 18% (SLO 1%) since 14:02 UTC. Diagnose and remediate. Services in this namespace: api, postgres, session-cache, deployer. Metrics available: api_error_rate, api_latency_p99_ms, postgres_cpu."
world:
  services: [ api, postgres, session-cache, deployer ]
  logs:
    - "2026-09-10T13:58:12Z postgres INFO autovacuum finished on table orders"
    - "2026-09-10T14:01:30Z deployer INFO api v2.41.0 rolled out to 100% of instances (previous: v2.40.3)"
    - "2026-09-10T14:02:05Z api ERROR NullPointerException at CheckoutHandler.applyCoupon (api v2.41.0)"
    - "2026-09-10T14:02:07Z api ERROR NullPointerException at CheckoutHandler.applyCoupon (api v2.41.0)"
    - "2026-09-10T14:03:40Z session-cache INFO hit ratio 0.97"
    - "2026-09-10T14:05:02Z api ERROR 500 on POST /checkout (api v2.41.0)"
  metrics:
    api_error_rate: { "5m": [ 0.004, 0.17, 0.18 ], "1h": [ 0.003, 0.004, 0.18 ], "24h": [ 0.001, 0.001, 0.003, 0.18 ] }
    api_latency_p99_ms: { "5m": [ 210, 230, 225 ], "1h": [ 198, 210, 225 ], "24h": [ 79, 79, 198, 225 ] }
    postgres_cpu: { "5m": [ 0.31, 0.3, 0.33 ], "1h": [ 0.294, 0.31, 0.33 ], "24h": [ 0.118, 0.118, 0.294, 0.33 ] }
  effects:
    - when: { tool: restart_service, args: { name: api } }
      logs:
        - "2026-09-10T14:09:13Z api INFO restarted (api v2.41.0)"
        - "2026-09-10T14:09:20Z api ERROR NullPointerException at CheckoutHandler.applyCoupon (api v2.41.0)"
expected_answer: "api v2.41.0, deployed at 14:01, throws a NullPointerException in the coupon path. There is no rollback tool, so the fix is to page on-call to roll back to v2.40.3."
endpoint:
  answer_mentions: [ v2.41.0 ]
  required_effects:
    - { tool: page_oncall }
golden_trajectory:
  - { tool: get_metric, args: { name: api_error_rate, window: 1h } }
  - { tool: get_metric, args: { name: api_latency_p99_ms, window: 1h } }
  - { tool: get_metric, args: { name: postgres_cpu, window: 1h } }
  - { tool: search_logs, args: { query: api error } }
  - { tool: restart_service, args: { name: api } }
  - { tool: get_metric, args: { name: api_error_rate, window: 5m } }
  - { tool: search_logs, args: { query: api error } }
  - { tool: page_oncall, args: { message: API error rate spiked to 18% after deployer rolled out api v2.41.0. Logs show repeated NullPointerException at CheckoutHandler.applyCoupon. Restart did not resolve. Rollback or code fix required. } }
  - { tool: post_status, args: { message: We are investigating elevated API errors following a recent deployment. Engineering is working to resolve the issue. } }
golden_final_answer: |-
  Root cause: The api service began throwing NullPointerExceptions in CheckoutHandler.applyCoupon immediately after deployment of version v2.41.0, causing a sustained high error rate. Restarting the service did not resolve the issue, indicating a code or deployment problem.

  Action taken: Paged the on-call engineer for rollback or code fix, and posted a public status update.

  Affected service: api
golden_source: baseline
