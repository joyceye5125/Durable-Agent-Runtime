id: incident_disk_full
kind: eval
task: "ALERT disk_usage_data{host=storage-1} = 96% (threshold 90%) on the /data partition. Diagnose and remediate. Services in this namespace: api, log-rotator, storage-agent, postgres. Metrics available: disk_usage_data, log_rotator_last_success_age_s, api_error_rate."
world:
  services: [ api, log-rotator, storage-agent, postgres ]
  logs:
    - "2026-09-10T02:10:04Z log-rotator ERROR rotation job failed: lock file /data/logs/.rotate.lock held by pid 4412 (stale, process not running)"
    - "2026-09-10T02:10:04Z log-rotator WARN skipping compression of /data/logs/api/*.log"
    - "2026-09-10T03:40:11Z storage-agent WARN /data at 91% used"
    - "2026-09-10T04:15:22Z postgres INFO checkpoint complete"
    - "2026-09-10T05:02:37Z storage-agent WARN /data at 96% used; largest directory /data/logs/api (212G)"
    - "2026-09-10T05:03:00Z api INFO request volume normal"
  metrics:
    disk_usage_data: { "5m": [ 0.95, 0.96, 0.96 ], "1h": [ 0.91, 0.93, 0.96 ], "24h": [ 0.71, 0.80, 0.88, 0.96 ] }
    log_rotator_last_success_age_s: { "1h": [ 86400, 88200, 90000 ], "5m": [ 89460, 89460, 90000 ], "24h": [ 34560, 34560, 86400, 90000 ] }
    api_error_rate: { "5m": [ 0.001, 0.001, 0.001 ], "1h": [ 0.001, 0.001, 0.001 ], "24h": [ 0.001, 0.001, 0.001, 0.001 ] }
  effects:
    - when: { tool: restart_service, args: { name: log-rotator } }
      metrics:
        disk_usage_data: { "5m": [ 0.96, 0.81, 0.62 ], "1h": [ 0.93, 0.96, 0.62 ] }
        log_rotator_last_success_age_s: { "1h": [ 88200, 90000, 12 ] }
      logs:
        - "2026-09-10T05:07:41Z log-rotator INFO stale lock cleared on start; rotated and compressed 188G under /data/logs/api"
expected_answer: "A stale lock file made log-rotator fail since 02:10, so API logs filled /data. Restarting log-rotator cleared the lock, rotated the logs, and /data fell back under the threshold."
endpoint:
  answer_mentions: [ log-rotator ]
  required_effects:
    - { tool: restart_service, args: { name: log-rotator } }
golden_trajectory:
  - { tool: search_logs, args: { query: storage-1 disk full OR no space OR disk usage OR /data } }
  - { tool: get_metric, args: { name: log_rotator_last_success_age_s, window: 1h } }
  - { tool: restart_service, args: { name: log-rotator } }
  - { tool: get_metric, args: { name: disk_usage_data, window: 5m } }
  - { tool: get_metric, args: { name: log_rotator_last_success_age_s, window: 5m } }
  - { tool: search_logs, args: { query: log-rotator success OR cleanup OR freed OR deleted } }
  - { tool: post_status, args: { message: "Incident resolved: Disk usage on storage-1 /data dropped from 96% to 62% after log-rotator was restarted and old logs were cleaned up. No further action required." } }
golden_final_answer: |-
  Root cause: The log-rotator service was stuck due to a stale lock file, preventing log cleanup and causing disk usage on storage-1 /data to reach 96%. 

  Action taken: Restarted the log-rotator service, which cleared the stale lock and freed up disk space by rotating and compressing old logs.

  Affected service: log-rotator (impacting /data disk usage).
golden_source: baseline
